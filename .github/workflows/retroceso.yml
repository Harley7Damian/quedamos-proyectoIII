name: Retroceso

# Vuelve la aplicacion publicada a un commit anterior. Ejecutar manualmente
# (Actions > Retroceso > Run workflow) indicando el SHA completo del commit.
# Para volver a la ultima version, ejecutar el workflow CI manualmente sobre main.

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "SHA completo (40 caracteres) del commit al que se quiere volver"
        required: true
        type: string

permissions:
  contents: read

env:
  URL_DESPLEGADA: https://quedamos-proyectoiii.onrender.com

jobs:
  retroceso:
    name: Volver a un commit anterior en Render
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: despliegue-render
      cancel-in-progress: false
    environment:
      name: produccion
      url: ${{ env.URL_DESPLEGADA }}
    steps:
      - name: Validar el commit indicado
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          if ! echo "$COMMIT" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "El commit debe ser un SHA completo de 40 caracteres hexadecimales."
            exit 1
          fi

      - name: Solicitar a Render el despliegue de ese commit
        env:
          COMMIT: ${{ inputs.commit }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Falta el secreto RENDER_DEPLOY_HOOK_URL en el repositorio."
            exit 1
          fi
          case "$RENDER_DEPLOY_HOOK_URL" in
            *\?*) separador="&" ;;
            *) separador="?" ;;
          esac
          respuesta=$(curl -fsS -X POST "${RENDER_DEPLOY_HOOK_URL}${separador}ref=${COMMIT}")
          id_despliegue=$(echo "$respuesta" | jq -r '.deploy.id // .id // "sin dato"')
          echo "Retroceso solicitado. Commit: ${COMMIT}. Id en Render: ${id_despliegue}"
          {
            echo "### Retroceso solicitado a Render"
            echo
            echo "- Commit: \`${COMMIT}\`"
            echo "- Id del despliegue en Render: \`${id_despliegue}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comprobar que la aplicacion responde
        run: |
          sleep 60
          curl -fsSL --retry 10 --retry-delay 15 --retry-all-errors --max-time 60 \
            -o /dev/null -w "Codigo HTTP final: %{http_code}\n" "$URL_DESPLEGADA/"
